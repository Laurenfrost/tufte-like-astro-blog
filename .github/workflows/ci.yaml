name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playground:
    name: Build (and deploy) the playground
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The playground is the only consumer of the theme in this repo, so
      # building it is what catches a broken component, route or export map.
      - name: Build
        env:
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
          IMAGE_TRANSFORM_OPTIONS: ${{ vars.IMAGE_TRANSFORM_OPTIONS }}
        run: npm run build

      # Deploying is optional: without credentials the job still passes, so
      # forks and pull requests get the build check and nothing else.
      - name: Check for Cloudflare credentials
        id: creds
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set — skipping the demo deploy."
          fi

      - name: Deploy demo
        if: steps.creds.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: playground
